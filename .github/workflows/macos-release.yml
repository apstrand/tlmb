# Releases the macOS desktop app when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag has to match the version in Cargo.toml. packaging/macos/build.sh
# --release does the work: the universal binary, Mailbox.app, the signature,
# notarization, the stapled ticket, and the .dmg and .zip on the GitHub
# release (README, "The macOS desktop app").
#
# This runs beside flatpak-release.yml on the same tag and the two share one
# GitHub release: whichever finishes first creates it, the other uploads into
# it. Neither replaces the other's assets.
#
# Secrets:
#   APPLE_CERTIFICATE          base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD its export password
#   TAURI_SIGNING_PRIVATE_KEY  minisign private key from `tauri signer generate`;
#                              its public half belongs in tauri.conf.json
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the passphrase that key was made with
#   APPLE_SIGNING_IDENTITY     "Developer ID Application: … (TEAMID)"
#   APPLE_API_KEY              App Store Connect key id, for notarization
#   APPLE_API_ISSUER           its issuer UUID
#   APPLE_API_KEY_BASE64       base64 of the AuthKey_<id>.p8 holding it:
#                              `base64 -i AuthKey_<id>.p8 | pbcopy`
#   MAILBOX_*_CLIENT_ID/SECRET optional OAuth2 client credentials to compile in
name: macos-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Two runs of the same tag would both sign and both upload; the second would
# clobber assets the first had already notarized.
concurrency:
  group: macos-release
  cancel-in-progress: false

permissions:
  contents: write # create or add to the release

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      MAILBOX_MACOS_GITHUB: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # codesign signs with a key from a keychain in the search list, and a
      # runner's login keychain holds nothing. This makes a throwaway one for
      # the job, so the key never touches a keychain that outlives it.
      - name: Signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::error::APPLE_CERTIFICATE is not set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"

          security create-keychain -p "$password" "$keychain"
          # Six hours before it locks itself again: longer than two release
          # builds and two notarization round trips, which is how far apart
          # the unlock here and the last codesign are.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Otherwise the first use of the key opens a dialog nobody is there
          # to click.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          # In front of the keychains already in the search list, not instead
          # of them: `security list-keychain -s` replaces the whole list.
          security list-keychain -d user -s "$keychain" \
            $(security list-keychain -d user | sed -e 's/[" ]//g')
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"

      # The notarization key goes to the build script as the secret it is;
      # the script is what turns it into the file notarytool reads, and what
      # removes that file again.
      - name: Build and release
        env:
          # The in-app updater will not unpack an archive whose signature
          # does not verify against the key compiled into the app. Without
          # this the build still publishes, just without a manifest for the
          # updater to read (see packaging/macos/build.sh).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          MAILBOX_GOOGLE_CLIENT_ID: ${{ secrets.MAILBOX_GOOGLE_CLIENT_ID }}
          MAILBOX_GOOGLE_CLIENT_SECRET: ${{ secrets.MAILBOX_GOOGLE_CLIENT_SECRET }}
          MAILBOX_MICROSOFT_CLIENT_ID: ${{ secrets.MAILBOX_MICROSOFT_CLIENT_ID }}
          MAILBOX_MICROSOFT_CLIENT_SECRET: ${{ secrets.MAILBOX_MICROSOFT_CLIENT_SECRET }}
          MAILBOX_YAHOO_CLIENT_ID: ${{ secrets.MAILBOX_YAHOO_CLIENT_ID }}
          MAILBOX_YAHOO_CLIENT_SECRET: ${{ secrets.MAILBOX_YAHOO_CLIENT_SECRET }}
        run: packaging/macos/build.sh --release

      # The keychain lives in RUNNER_TEMP and the runner is thrown away, but a
      # job that fails after importing should not leave the key readable to
      # whatever runs next on a self-hosted one.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
