# Builds the iOS app and ships it to TestFlight when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag has to match the version in Cargo.toml; that becomes the build's
# marketing version (CFBundleShortVersionString). The TestFlight build number
# (CFBundleVersion) is the GitHub run number, which only ever climbs, so each
# upload is accepted as newer than the last.
#
# Signing is manual, with assets you supply, and nothing is asked of Apple at
# build time. An earlier cut let xcodebuild cloud-sign — fetch or mint the
# provisioning profile through the API key — and the key, which was first made
# for notarization, lacked the role that needs ("Cloud signing permission
# error"). So the job imports an Apple Distribution cert into a throwaway
# keychain and installs a matching App Store provisioning profile you exported
# once by hand; the export is pinned to both. The API key is left to do the one
# thing it is unarguably allowed to: upload the finished build.
#
# Secrets:
#   IOS_DISTRIBUTION_CERTIFICATE          base64 of an Apple Distribution .p12
#   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD its export password
#   IOS_PROVISIONING_PROFILE              base64 of an App Store .mobileprovision
#                                         for com.thelastmailbox.ios, tied to the
#                                         cert above. Make it in the Developer
#                                         portal (Profiles → App Store), then:
#                                         base64 -i profile.mobileprovision | pbcopy
#   APPLE_API_KEY            App Store Connect key id (reused from the macOS
#                            release job), for the upload only
#   APPLE_API_ISSUER         its issuer UUID
#   APPLE_API_KEY_BASE64     base64 of the AuthKey_<id>.p8 for that key
#   APPLE_TEAM_ID            the 10-character Apple Developer Team ID
#
# The app record (bundle id com.thelastmailbox.ios) must already exist in App
# Store Connect; this job uploads builds to it, it does not create it.
name: ios-testflight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Two runs of the same tag would upload two builds with different run numbers;
# harmless but pointless. Serialize instead.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # macos-latest ships a recent Xcode, but pin it so an image bump cannot
      # silently change the SDK the build is cut against.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The archive's build phase cross-compiles mailbox-ffi for the device
      # (ios/build-ffi.sh picks aarch64-apple-ios for the iphoneos SDK), so the
      # target has to be installed before xcodebuild runs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Version and build number
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
          fi
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building $version ($GITHUB_RUN_NUMBER)"

      # A throwaway keychain holds the distribution key for the life of the job
      # only; the runner is discarded after, but on a self-hosted one the key
      # must not outlive the build that imported it.
      - name: Signing certificate
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE" ]]; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE is not set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE" | base64 --decode > "$certificate"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          # Let codesign use the key without a GUI confirmation dialog.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          # Add it to the search list rather than replacing the list.
          security list-keychain -d user -s "$keychain" \
            $(security list-keychain -d user | sed -e 's/[" ]//g')
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"

      # Install the App Store profile where xcodebuild looks for it, and read its
      # name back out — that name is what the archive and the export plist pin
      # the signing to, so neither has to be hardcoded here.
      - name: Provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -z "$PROFILE" ]]; then
            echo "::error::IOS_PROVISIONING_PROFILE is not set"
            exit 1
          fi
          profile="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE" | base64 --decode > "$profile"
          plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          cp "$profile" "$dir/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "Installed profile '$name' ($uuid)"

      # altool finds the key by id under ~/.appstoreconnect/private_keys.
      - name: App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY_BASE64" ]]; then
            echo "::error::APPLE_API_KEY_BASE64 is not set"
            exit 1
          fi
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_${APPLE_API_KEY}.p8"
          echo "$API_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"

      # The project keeps a hand-written Info.plist (GENERATE_INFOPLIST_FILE is
      # off), so the version strings are literals in the file, not build
      # settings xcodebuild could override. Write them in before archiving.
      - name: Stamp the version
        run: |
          set -euo pipefail
          plist="ios/Mailbox/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/Mailbox.xcodeproj \
            -scheme mailbox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/mailbox.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export the ipa
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.thelastmailbox.ios</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/mailbox.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "Uploading $ipa"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
