# Dovecot for the L2 suite (§14.2). Not a production configuration — it accepts
# any username with a fixed password, on purpose, so a test can mint a fresh
# account in zero round trips (§14's "cheap reset").

protocols = imap
listen = *

# Plaintext on loopback only. §9 permits exactly this shape, and it keeps the
# harness free of certificate plumbing that tests nothing about our sync engine.
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

# Any username, one password. The reset of §14 is then "use a name you have not
# used yet", which costs nothing and lets tests run in parallel.
passdb {
  driver = static
  args = password=testpass
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/mail/%u
}

mail_location = maildir:/srv/mail/%u/Maildir
mail_uid = vmail
mail_gid = vmail
# Dovecot refuses to create a home under a root-owned parent without this.
mail_home = /srv/mail/%u

namespace inbox {
  inbox = yes
  separator = /

  # SPECIAL-USE (RFC 6154), so the folder-ranking of §5.3 has something real to
  # test against rather than only the name heuristic.
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

# Enough headroom that a test appending a few hundred fixtures does not hit a
# limit and look like a sync bug.
service imap {
  process_limit = 256
}

# The extensions §5.3 uses when advertised. Dovecot implements them natively;
# naming them here is documentation of what the L2 suite is asserting is on.
mail_plugins = $mail_plugins

# Quiet, but not silent: a failing test wants the server's side of the story.
log_path = /dev/stderr
info_log_path = /dev/stderr
auth_verbose = yes

# A first sync of a fixture set should not race the indexer.
mailbox_list_index = yes
