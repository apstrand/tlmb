# Dovecot 2.4 for the e2e guest. Arch ships 2.4; the L2 Docker image is
# Debian 2.3 (`tests/dovecot/dovecot.conf`) and those files do not load here.
#
# Same behaviour as L2: any username, password testpass, maildir under
# /srv/mail, plaintext on loopback, SPECIAL-USE folders.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = yes
}

listen = *

ssl = no
auth_allow_cleartext = yes
auth_allow_weak_schemes = yes
auth_mechanisms = plain login

passdb static {
  password = testpass
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/mail/%{user}
  }
}

mail_driver = maildir
mail_path = ~/Maildir
mail_home = /srv/mail/%{user}
mail_uid = vmail
mail_gid = vmail

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service imap {
  process_limit = 256
}

log_path = /dev/stderr
info_log_path = /dev/stderr
auth_verbose = yes
mailbox_list_index = yes
