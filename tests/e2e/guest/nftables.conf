# Mail never leaves the guest. Loopback is the only path to IMAP/SMTP.
# SSH, DNS, and HTTP stay available so provision and the evidence tools work;
# `mailbox-e2e isolate` then drops the VM onto a libvirt network with no WAN.

flush ruleset

table inet mailbox_e2e {
    chain output {
        type filter hook output priority 0; policy accept;
        oif "lo" accept
        tcp dport { 25, 465, 587, 143, 993, 995, 110, 2525 } reject
    }
}
