[workspace]
resolver = "2"
members = [
    "crates/mailbox-api",
    "crates/mailbox-core",
    "crates/mailbox-cli",
    "crates/mailbox-l3",
    "crates/mailbox-tui",
    "crates/mailbox-ui",
    "crates/mailbox-web",
    "crates/mailbox-ffi",
    "crates/mailbox-wasm",
]

[workspace.package]
version = "0.1.20"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/apstrand/tlmb"

[workspace.dependencies]
mailbox-api = { path = "crates/mailbox-api" }
mailbox-core = { path = "crates/mailbox-core" }
mailbox-l3 = { path = "crates/mailbox-l3" }
mailbox-tui = { path = "crates/mailbox-tui" }
mailbox-ui = { path = "crates/mailbox-ui" }
mailbox-web = { path = "crates/mailbox-web" }
mailbox-ffi = { path = "crates/mailbox-ffi" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
