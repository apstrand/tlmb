[package]
name = "mailbox-ui"
description = "The desktop GUI (§7): a Tauri window around the shared DOM client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mailbox-api.workspace = true
mailbox-core.workspace = true
mailbox-web.workspace = true
serde.workspace = true
serde_json.workspace = true

tauri = { version = "2", default-features = true }

# The Flatpak portal is reached over D-Bus with the GLib bindings Tauri's GTK
# window already links, so self-update adds no second D-Bus stack.
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
glib = "0.18"
