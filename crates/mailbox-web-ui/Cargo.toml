[package]
name = "mailbox-web-ui"
description = "The shared interface (§7) compiled to wasm — the web half of `mailbox serve`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mailbox-api.workspace = true
mailbox-ui.workspace = true
serde.workspace = true
serde_json.workspace = true

egui = "0.28"

# Only when there is a browser to draw in. Keeping these off the host build is
# what lets the workspace compile without the wasm target installed.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Headers", "Request", "RequestInit", "Response", "Window",
] }
