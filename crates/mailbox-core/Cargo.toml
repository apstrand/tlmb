[package]
name = "mailbox-core"
description = "Store, sync engine, query, threading, and MIME. No I/O policy, no UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
mailbox-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

rusqlite = { version = "0.40", features = ["bundled", "blob", "serialize"] }
mail-parser = "0.11"
imap-proto = "0.16"
blake3 = "1"
zstd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
base64 = "0.22"
toml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
getrandom = "0.3"
nom = "7"
libc = "0.2.189"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
argon2 = "0.6.0"
# §8.1's balanced PAKE. A port of jedisct1's libsodium CPace, over Ristretto255
# — the same rule as the rest of `pair::crypto`: a named primitive from someone
# who writes cryptography for a living, never a construction of our own.
pake-cpace = "0.1.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls-native-certs = "0.8"

# `wasm32-unknown-unknown` has no ambient entropy source. All three versions
# are present in the crypto graph, so the JS backend must be selected for each.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
wasm-bindgen = "0.2"

[dev-dependencies]
getrandom = "0.3"
# The in-tree adversarial server (§14.2), so `accounts::verify` can be tested
# against something that answers IMAP without reaching a real provider.
mailbox-l3 = { path = "../mailbox-l3" }
hkdf = "0.13.0"
imap-proto = "0.16"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11.0"
toml = "0.9"
