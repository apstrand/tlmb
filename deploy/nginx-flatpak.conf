# The Flatpak update site: the signed OSTree repository the desktop app
# updates itself from, plus tlmb.flatpakref and tlmb.flatpakrepo.
# packaging/flatpak/build.sh --release uploads it with rsync (deploy/Release.md).
#
# Install as /etc/nginx/sites-available/tlmb-flat.2615.io, link it into
# sites-enabled, validate with `nginx -t`, then reload.
#
# There is deliberately no `try_files … /index.html` fallback here. OSTree asks
# for files that may legitimately be missing — a summary signature, a static
# delta for a version the client does not have — and reads a 404 as "not
# there". An index page returned with 200 instead looks to it like a corrupt
# object, and updates fail in ways that are hard to read.

server {
    server_name tlmb-flat.2615.io;

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /etc/letsencrypt/live/tlmb-flat.2615.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlmb-flat.2615.io/privkey.pem;

    root /home/peter/web/tlmb-flat;
    index index.html;

    # Objects are immutable and named after their content; the summary and the
    # refs are what changes, so they must not be held on to.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/repo/(summary|summary\.sig)$ {
        add_header Cache-Control "no-cache" always;
    }

    location /repo/objects/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /repo/deltas/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

server {
    if ($host = tlmb-flat.2615.io) {
        return 301 https://$host$request_uri;
    }

    server_name tlmb-flat.2615.io;
    listen 80;
    listen [::]:80;
    return 404;
}
